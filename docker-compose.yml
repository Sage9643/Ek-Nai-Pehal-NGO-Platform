

services:

  backend:
    build:
      context: ./server
    container_name: ngo_backend

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    volumes:
      - ./server:/app
      - /app/node_modules

    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: ngo_frontend

    ports:
      - "5173:5173"

    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api

    depends_on:
      - backend

    volumes:
      - ./client:/app
      - /app/node_modules

    restart: unless-stopped